apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentiment-analysis.fullname" . }}-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sentiment-analysis.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: sentiment-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
