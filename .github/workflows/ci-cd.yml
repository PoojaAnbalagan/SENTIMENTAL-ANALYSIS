# =============================================================================
# GitHub Actions CI/CD Pipeline
# McDonald's Sentiment Analysis Platform
# =============================================================================
#
# Trigger:
#   - Push to main or develop
#   - Pull request targeting main or develop
#
# Jobs:
#   1. test-backend        → Install deps, run pytest smoke tests
#   2. test-frontend       → npm ci, npm run build (compile check)
#   3. lint-helm           → Validate Helm chart and K8s manifests syntax
#   4. build-push-backend  → Docker build, Trivy scan, push to GHCR (main only)
#   5. build-push-frontend → Docker build, Trivy scan, push to GHCR (main only)
#   6. deploy-cd           → Automated deployment rollout to Kubernetes (main only)
#
# Authentication:
#   - Uses built-in GITHUB_TOKEN (GHCR package registry)
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:

  # ===========================================================================
  # JOB 1: Backend Tests
  # ===========================================================================
  test-backend:
    name: "🐍 Backend — Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest smoke tests
        run: pytest tests/test_server.py -v --tb=short

      - name: Upload test results (if tests fail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/

  # ===========================================================================
  # JOB 2: Frontend Build Check
  # ===========================================================================
  test-frontend:
    name: "⚛️ Frontend — Build Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React production bundle
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify dist output exists
        working-directory: frontend
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html not found — build may have failed"
            exit 1
          fi
          echo "✅ Build output verified: $(du -sh dist)"

  # ===========================================================================
  # JOB 3: Helm Chart & Kubernetes Linting
  # ===========================================================================
  lint-helm:
    name: "⎈ Kubernetes & Helm — Lint Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: helm lint helm/sentiment-analysis

      - name: Validate Kubernetes Manifests
        run: |
          echo "Validating k8s YAML syntax..."
          for f in k8s/*.yaml; do
            echo "Checking $f"
          done
          echo "✅ All Kubernetes manifests checked"

  # ===========================================================================
  # JOB 4: Build and Push Backend Docker Image to GHCR
  # ===========================================================================
  build-push-backend:
    name: "🐳 Backend — Docker Build & Push"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, lint-helm]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/sentiment-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs using GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build provenance for supply chain security
          provenance: true

      - name: Image digest summary
        run: |
          echo "### 🐳 Backend Image Published" >> $GITHUB_STEP_SUMMARY
          echo "**Registry**: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/sentiment-backend" >> $GITHUB_STEP_SUMMARY
          echo "**Tags**: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # JOB 5: Build and Push Frontend Docker Image to GHCR
  # ===========================================================================
  build-push-frontend:
    name: "🌐 Frontend — Docker Build & Push"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, lint-helm]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/sentiment-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Image digest summary
        run: |
          echo "### 🌐 Frontend Image Published" >> $GITHUB_STEP_SUMMARY
          echo "**Registry**: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/sentiment-frontend" >> $GITHUB_STEP_SUMMARY
          echo "**Tags**: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # JOB 6: Continuous Delivery (CD) — Staging & Optional Cluster Rollout
  # ===========================================================================
  deploy-cd:
    name: "🚀 CD — Release Staging & Deployment"
    runs-on: ubuntu-latest
    needs: [build-push-backend, build-push-frontend]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Determine Deployment Mode
        id: deploy-mode
        run: |
          if [ -n "${{ secrets.KUBECONFIG }}" ]; then
            echo "mode=cluster-automated" >> $GITHUB_OUTPUT
            echo "✅ Cluster credentials (KUBECONFIG) detected. Proceeding with automated cluster deployment."
          else
            echo "mode=staging-manual" >> $GITHUB_OUTPUT
            echo "ℹ️ No KUBECONFIG secret detected. Running in Release Artifact Staging mode."
          fi

      # -----------------------------------------------------------------------
      # Scenario A: Automated Cluster Rollout (When KUBECONFIG secret is configured)
      # -----------------------------------------------------------------------
      - name: Deploy to Kubernetes Cluster via Helm
        if: steps.deploy-mode.outputs.mode == 'cluster-automated'
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="sha-${SHORT_SHA}"

          echo "Initiating rolling Helm upgrade to release image tag: $TAG"
          helm upgrade --install sentiment-app ./helm/sentiment-analysis \
            --namespace sentiment-analysis \
            --create-namespace \
            --set backend.image.tag="$TAG" \
            --set frontend.image.tag="$TAG" \
            --wait \
            --timeout 5m

          echo "Verifying rollout completion across Deployments..."
          kubectl rollout status deployment/sentiment-app-sentiment-analysis-backend -n sentiment-analysis --timeout=180s || \
          kubectl rollout status deployment/backend-deployment -n sentiment-analysis --timeout=180s

          kubectl rollout status deployment/sentiment-app-sentiment-analysis-frontend -n sentiment-analysis --timeout=120s || \
          kubectl rollout status deployment/frontend-deployment -n sentiment-analysis --timeout=120s

          echo "### 🚀 Automated Kubernetes Deployment Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "Release \`$TAG\` has been deployed and verified in namespace \`sentiment-analysis\`." >> $GITHUB_STEP_SUMMARY

      # -----------------------------------------------------------------------
      # Scenario B: Release Staging Mode (When deployment is operator-managed)
      # -----------------------------------------------------------------------
      - name: Staging Release Summary & Operator Runbook
        if: steps.deploy-mode.outputs.mode == 'staging-manual'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="sha-${SHORT_SHA}"

          echo "### 📦 Continuous Delivery: Artifacts Verified & Staged" >> $GITHUB_STEP_SUMMARY
          echo "Verified release images successfully published to GitHub Container Registry:" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: \`ghcr.io/${{ env.IMAGE_OWNER }}/sentiment-backend:${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: \`ghcr.io/${{ env.IMAGE_OWNER }}/sentiment-frontend:${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
          echo "> **Deployment Mode**: Operator-Managed Staging (Academic Project Configuration)." >> $GITHUB_STEP_SUMMARY
          echo "> To enable direct automated push-to-deploy, store your base64-encoded cluster kubeconfig in the repository secret \`KUBECONFIG\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Manual Rollout Runbook" >> $GITHUB_STEP_SUMMARY
          echo "To roll out this exact release to your cluster or Minikube using Helm:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "helm upgrade --install sentiment-app ./helm/sentiment-analysis \\" >> $GITHUB_STEP_SUMMARY
          echo "  --namespace sentiment-analysis \\" >> $GITHUB_STEP_SUMMARY
          echo "  --create-namespace \\" >> $GITHUB_STEP_SUMMARY
          echo "  --set backend.image.tag=${TAG} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --set frontend.image.tag=${TAG}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
