# =============================================================================
# GitHub Actions CI/CD Pipeline
# McDonald's Sentiment Analysis Platform
# =============================================================================
#
# Trigger:
#   - Push to main or develop
#   - Pull request targeting main or develop
#
# Jobs:
#   1. test-backend        → Install deps, run pytest smoke tests
#   2. test-frontend       → npm ci, npm run build (compile check)
#   3. build-push-backend  → Docker build + push to GHCR (main branch only)
#   4. build-push-frontend → Docker build + push to GHCR (main branch only)
#
# Images are tagged with:
#   - latest
#   - git commit SHA (short)
#
# Authentication:
#   - Uses built-in GITHUB_TOKEN (no extra secrets needed for GHCR)
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancel in-progress runs when a new push to the same branch arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Lowercase owner name (GitHub requirement for GHCR image names)
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:

  # ===========================================================================
  # JOB 1: Backend Tests
  # ===========================================================================
  test-backend:
    name: "🐍 Backend — Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest smoke tests
        run: pytest tests/test_server.py -v --tb=short

      - name: Upload test results (if tests fail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/

  # ===========================================================================
  # JOB 2: Frontend Build Check
  # ===========================================================================
  test-frontend:
    name: "⚛️ Frontend — Build Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React production bundle
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify dist output exists
        working-directory: frontend
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html not found — build may have failed"
            exit 1
          fi
          echo "✅ Build output verified: $(du -sh dist)"

  # ===========================================================================
  # JOB 3: Build and Push Backend Docker Image to GHCR
  # Runs only on push to main (not on PRs)
  # ===========================================================================
  build-push-backend:
    name: "🐳 Backend — Docker Build & Push"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/sentiment-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs using GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build provenance for supply chain security
          provenance: true

      - name: Image digest summary
        run: |
          echo "### 🐳 Backend Image Published" >> $GITHUB_STEP_SUMMARY
          echo "**Registry**: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/sentiment-backend" >> $GITHUB_STEP_SUMMARY
          echo "**Tags**: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # JOB 4: Build and Push Frontend Docker Image to GHCR
  # Runs only on push to main (not on PRs)
  # ===========================================================================
  build-push-frontend:
    name: "🌐 Frontend — Docker Build & Push"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/sentiment-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Image digest summary
        run: |
          echo "### 🌐 Frontend Image Published" >> $GITHUB_STEP_SUMMARY
          echo "**Registry**: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/sentiment-frontend" >> $GITHUB_STEP_SUMMARY
          echo "**Tags**: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
