# =============================================================================
# Kubernetes Secret — Template File (DO NOT commit real values)
# McDonald's Sentiment Analysis Platform
# =============================================================================
#
# ⚠️  WARNING: This file contains PLACEHOLDER base64 values only.
#              Never commit real secret values to git.
#
# How to use:
#   1. Copy this file: cp k8s/secret.yaml k8s/secret.filled.yaml
#   2. Replace placeholder values with real base64-encoded secrets:
#      echo -n "your-actual-value" | base64
#   3. Apply: kubectl apply -f k8s/secret.filled.yaml -n sentiment-analysis
#   4. The secret.filled.yaml is in .gitignore — it will NOT be committed.
#
# Current application secrets needed:
#   - None required for the base sentiment analysis app
#   - This template is ready for when you add: DB credentials, API keys, etc.
#
# Apply template (safe, placeholders only):
#   kubectl apply -f k8s/secret.yaml -n sentiment-analysis
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: sentiment-secrets
  namespace: sentiment-analysis
  labels:
    app.kubernetes.io/name: sentiment-analysis
    app.kubernetes.io/component: secrets
type: Opaque

# ---------------------------------------------------------------------------
# All values must be base64-encoded.
# To encode: echo -n "plaintext-value" | base64
# To decode: echo "encoded-value" | base64 -d
# ---------------------------------------------------------------------------
data:
  # Placeholder — replace with real value if you add a database
  # DB_PASSWORD: <base64-encoded-value>

  # Placeholder — replace with real value if you add external API access
  # EXTERNAL_API_KEY: <base64-encoded-value>

  # Example of a real secret entry (placeholder value shown):
  # SECRET_KEY: c2VudGltZW50LWFuYWx5c2lzLXNlY3JldC1rZXktMjAyNg==
  # (Decodes to: sentiment-analysis-secret-key-2026)
  SECRET_KEY: c2VudGltZW50LWFuYWx5c2lzLXNlY3JldC1rZXktMjAyNg==
