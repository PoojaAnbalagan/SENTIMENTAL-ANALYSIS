# =============================================================================
# Kubernetes Horizontal Pod Autoscaler (HPA) — Backend
# McDonald's Sentiment Analysis Platform
# =============================================================================
# Automatically scales backend replicas based on CPU & Memory load
# generated by incoming multi-model sentiment inference requests.
#
# Prerequisites:
#   - Kubernetes Metrics Server must be running in the cluster.
#
# Apply:
#   kubectl apply -f k8s/hpa.yaml -n sentiment-analysis
# =============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: sentiment-analysis
  labels:
    app.kubernetes.io/name: sentiment-analysis
    app.kubernetes.io/component: backend
    app: sentiment-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment
  minReplicas: 2
  maxReplicas: 8
  metrics:
    # Scale when average CPU exceeds 75%
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

    # Scale when average Memory exceeds 80%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
      selectPolicy: Min
