# =============================================================================
# Kubernetes Secret — Template File (DO NOT commit real production values)
# McDonald's Sentiment Analysis Platform
# =============================================================================
#
# ⚠️  SECURITY NOTICE:
#   Kubernetes Secrets are base64-encoded, NOT encrypted at rest by default.
#   Never commit actual registry tokens, API keys, or database credentials to GitHub.
#
# Recommended Production Setup:
#   1. Local/Cluster CLI: Generate secret imperatively with kubectl:
#        kubectl create secret generic sentiment-secrets \
#          --namespace sentiment-analysis \
#          --from-literal=SECRET_KEY="$(openssl rand -hex 32)"
#
#   2. External Secret Management: Use HashiCorp Vault, AWS Secrets Manager,
#      or Azure Key Vault via External Secrets Operator (ESO).
#
#   3. GitHub Actions CI/CD: Inject secrets via repository secrets:
#        ${{ secrets.APPLICATION_SECRET_KEY }}
#
# Usage for this file:
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # Update the values below, then apply:
#   kubectl apply -f k8s/secret.yaml -n sentiment-analysis
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: sentiment-secrets
  namespace: sentiment-analysis
  labels:
    app.kubernetes.io/name: sentiment-analysis
    app.kubernetes.io/component: secrets
type: Opaque

# stringData allows human-readable plaintext strings which Kubernetes
# automatically base64-encodes upon creation.
stringData:
  # Secret key for session management, API signing, or cryptographic operations
  SECRET_KEY: "CHANGE_ME_TO_A_SECURE_RANDOM_SECRET_STRING"
