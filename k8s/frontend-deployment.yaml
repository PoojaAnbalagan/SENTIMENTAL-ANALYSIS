# =============================================================================
# Kubernetes Frontend Deployment — React (Nginx)
# McDonald's Sentiment Analysis Platform
# =============================================================================
#
# BEFORE APPLYING: Replace <YOUR_GITHUB_USERNAME> with your actual GitHub
# username (lowercase). The image must already be pushed to GHCR.
#
# Apply: kubectl apply -f k8s/frontend-deployment.yaml -n sentiment-analysis
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: sentiment-analysis
  labels:
    app.kubernetes.io/name: sentiment-analysis
    app.kubernetes.io/component: frontend
    app: sentiment-frontend

spec:
  # 2 replicas for high availability
  replicas: 2

  selector:
    matchLabels:
      app: sentiment-frontend

  # ---------------------------------------------------------------------------
  # Rolling update strategy — zero-downtime deployments
  # ---------------------------------------------------------------------------
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: sentiment-frontend
        version: "2026.1"

    spec:
      terminationGracePeriodSeconds: 30

      # Image pull secret for private registry access (GHCR)
      # Create with: kubectl create secret docker-registry ghcr-secret \
      #   --docker-server=ghcr.io --docker-username=<USER> --docker-password=<PAT> \
      #   -n sentiment-analysis
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: frontend
          image: ghcr.io/poojaanbalagan/sentiment-frontend:latest

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          # -----------------------------------------------------------------
          # Resource requests and limits
          # Nginx serving static files is very lightweight
          # -----------------------------------------------------------------
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          # -----------------------------------------------------------------
          # Liveness probe: restart pod if Nginx stops responding
          # Uses the /health endpoint defined in nginx.conf
          # -----------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # -----------------------------------------------------------------
          # Readiness probe: don't send traffic until Nginx is ready
          # -----------------------------------------------------------------
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # -----------------------------------------------------------------
          # Startup probe: allow time for Nginx to initialize
          # -----------------------------------------------------------------
          startupProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10    # 10 * 3s = 30s max startup time

      # Spread pods across nodes for fault tolerance
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: sentiment-frontend
