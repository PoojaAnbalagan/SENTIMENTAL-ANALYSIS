# =============================================================================
# Nginx Configuration — McDonald's Sentiment Analysis Platform (Frontend)
# =============================================================================
# This config:
#   1. Serves React static files
#   2. Handles SPA routing (all unknown paths → index.html)
#   3. Reverse-proxies /api/* and /static/* to the FastAPI backend
#   4. Enables gzip compression
#   5. Sets proper cache headers for assets
# =============================================================================

server {
    listen 80;
    server_name _;

    # Root directory for static files (React build output)
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Backend API reverse proxy
    # All /api/* requests are forwarded to the FastAPI backend container
    # In Docker Compose: service name "backend"
    # In Kubernetes:    service name "backend-service"
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts — ML inference can take a moment
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # Static figures reverse proxy
    # Figures served by FastAPI at /static/figures/
    # -------------------------------------------------------------------------
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static figures aggressively
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # -------------------------------------------------------------------------
    # Nginx health check endpoint (used by Docker HEALTHCHECK and K8s probes)
    # -------------------------------------------------------------------------
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # -------------------------------------------------------------------------
    # React SPA — serve index.html for all non-file routes
    # This enables client-side routing (React Router, etc.)
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Cache control for hashed static assets (JS, CSS)
    # Vite generates content-hashed filenames — safe to cache forever
    # -------------------------------------------------------------------------
    location ~* \.(js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Error pages
    # -------------------------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
